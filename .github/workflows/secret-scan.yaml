name: 'Secret Scan'

# Scans the full git history for committed secrets (API keys, tokens, passwords, private keys) with
# Gitleaks on every push and pull request. Findings are redacted in the log and listed in the job summary.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the git history
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/gitleaks.json"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$report" .
          status=$?
          {
            echo "## Secret scan"
            if [[ $status -eq 0 ]]; then
              echo "No secrets found in the git history."
            else
              echo "Gitleaks reported possible secrets (values redacted). Revoke and rotate any real credential"
              echo "first, then remove it from the history; deleting the line in a new commit is not enough."
              echo
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:12]) |"' "$report" 2>/dev/null
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
