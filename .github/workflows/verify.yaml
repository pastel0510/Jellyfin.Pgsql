name: 'Verify'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      LOG_DIR: ${{ github.workspace }}/.ci-logs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Find the newest published image for the upgrade test
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/previous_image.sh "ghcr.io/${OWNER,,}/jellyfin.pgsql" >> "$GITHUB_ENV"

      - name: Install migration test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pgloader sqlite3 python3-psycopg

      - name: Build, check migrations, smoke and migration tests
        env:
          FULL: '1'
        run: scripts/verify.sh

      - name: Upload smoke test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-logs
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore
          include-hidden-files: true
