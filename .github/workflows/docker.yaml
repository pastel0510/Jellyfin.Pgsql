name: 'Build & Publish Docker Image'

# Publishes ghcr.io/<owner>/jellyfin.pgsql:<jellyfin version>-<n> plus the moving tags <jellyfin version> and latest:
# automatically after Verify passes on master when the image changed, and on demand. Each published build also gets a
# git tag and a GitHub release whose notes list the changes and any new database migration.
on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'docker/**'
      - 'Jellyfin.Plugin.Pgsql/**'
      - '.github/workflows/docker.yaml'

permissions: {}

# Serialise publishes so two runs can't compute the same rolling tag.
concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether to build
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          VERIFY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VERIFY_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          publish=true
          if [[ "$EVENT" == "workflow_run" ]]; then
            # Only a successful Verify of a push to master, and only when the commit changed what goes into the image.
            if [[ "$VERIFY_CONCLUSION" != "success" || "$VERIFY_EVENT" != "push" ]]; then
              echo "::notice::Verify was $VERIFY_CONCLUSION for a $VERIFY_EVENT event; not publishing"
              publish=false
            elif ! git diff --name-only HEAD^1 HEAD | grep -qE '^(Jellyfin\.Plugin\.Pgsql/|docker/|Jellyfin\.Plugin\.Pgsql\.sln$|build\.yaml$|jellyfin\.ruleset$)'; then
              echo "::notice::No change to the plugin or Docker files in $(git rev-parse --short HEAD); not publishing"
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine image name and version
        id: version
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GHCR image names must be lowercase; derive from the repo owner so forks publish to their own namespace.
          IMAGE="ghcr.io/${OWNER,,}/jellyfin.pgsql"

          # Extract the Jellyfin base version from the Dockerfile (handles optional AS alias)
          JELLYFIN_VERSION=$(grep -oP '(?<=FROM jellyfin/jellyfin:)[^\s]+' docker/Dockerfile | head -1)

          EXISTING_TAGS=""
          if [[ "$PUSH" == "true" ]]; then
            # List existing tags straight from the registry (works for user and org owners alike).
            if OUT=$(skopeo list-tags --creds "${ACTOR}:${GH_TOKEN}" "docker://${IMAGE}" 2>err.txt); then
              EXISTING_TAGS=$(jq -r '.Tags[]' <<<"$OUT")
            elif grep -qiE 'name unknown|not found|404|denied|unauthorized' err.txt; then
              echo "::notice::No existing ${IMAGE} package found, assuming first publish"
            else
              cat err.txt
              exit 1
            fi
          fi

          # Find the highest rolling number already published for this Jellyfin version.
          # Escape dots in the version so they are treated as literals in the regex.
          ESCAPED_VERSION=$(printf '%s' "$JELLYFIN_VERSION" | sed 's/[.]/\\./g')
          MAX_ROLLING=$(grep -oP "^${ESCAPED_VERSION}-\K[0-9]+$" <<<"$EXISTING_TAGS" | sort -n | tail -1 || true)

          IMAGE_TAG="${JELLYFIN_VERSION}-$(( ${MAX_ROLLING:-0} + 1 ))"

          # The plugin version follows the build number, checked against the plugin repository manifest on master so
          # that it only goes up (publishes are serialised, so the manifest there is current).
          git show origin/master:manifest.json > "$RUNNER_TEMP/manifest.json" 2>/dev/null || cp manifest.json "$RUNNER_TEMP/manifest.json"
          PLUGIN_VERSION="$(python3 .github/scripts/plugin_manifest.py next-version "$RUNNER_TEMP/manifest.json" "$JELLYFIN_VERSION" "$(( ${MAX_ROLLING:-0} + 1 ))")"
          {
            echo "image=$IMAGE"
            echo "jellyfin_version=$JELLYFIN_VERSION"
            echo "image_tag=$IMAGE_TAG"
            echo "plugin_version=$PLUGIN_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Computed image: ${IMAGE}:${IMAGE_TAG}, plugin version ${PLUGIN_VERSION}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.image_tag }}
            type=raw,value=${{ steps.version.outputs.jellyfin_version }},enable=${{ env.PUSH == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master') }}
            type=raw,value=latest,enable=${{ env.PUSH == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master') }}
          labels: |
            org.opencontainers.image.title=Jellyfin PostgreSQL
            org.opencontainers.image.description=Jellyfin with the experimental PostgreSQL database provider plugin
          annotations: |
            org.opencontainers.image.description=Jellyfin with the experimental PostgreSQL database provider plugin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            PLUGIN_VERSION=${{ steps.version.outputs.plugin_version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package the plugin for installs without Docker
        id: package
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLUGIN_VERSION: ${{ steps.version.outputs.plugin_version }}
        run: |
          set -euo pipefail
          # The package holds exactly the plugin files of the image just published.
          docker pull --quiet --platform linux/amd64 "${IMAGE}@${DIGEST}" >/dev/null
          cid="$(docker create --platform linux/amd64 "${IMAGE}@${DIGEST}")"
          mkdir -p "$RUNNER_TEMP/plugin"
          docker cp "$cid:/jellyfin-pgsql/plugin/." "$RUNNER_TEMP/plugin/"
          docker rm "$cid" >/dev/null
          zip_name="jellyfin-pgsql_${PLUGIN_VERSION}.zip"
          (cd "$RUNNER_TEMP/plugin" && zip -q -X -r "$RUNNER_TEMP/$zip_name" .)
          unzip -l "$RUNNER_TEMP/$zip_name"
          {
            echo "zip=$RUNNER_TEMP/$zip_name"
            echo "zip_name=$zip_name"
            echo "checksum=$(md5sum "$RUNNER_TEMP/$zip_name" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the build and publish its release notes
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.image_tag }}
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LATEST: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
          PLUGIN_VERSION: ${{ steps.version.outputs.plugin_version }}
          PLUGIN_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.image_tag }}/${{ steps.package.outputs.zip_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          .github/scripts/release_notes.sh "$TAG" "$sha" "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          gh release create "$TAG" "$ZIP" --target "$sha" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest="$LATEST"

      - name: Add the build to the plugin repository manifest
        # Only builds of master; the manifest lists what a plugin repository offers for updates.
        if: env.PUSH == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.image_tag }}
          JELLYFIN_VERSION: ${{ steps.version.outputs.jellyfin_version }}
          PLUGIN_VERSION: ${{ steps.version.outputs.plugin_version }}
          PLUGIN_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.image_tag }}/${{ steps.package.outputs.zip_name }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          target_abi="$(grep -oP '^targetAbi: "\K[^"]+' build.yaml)"
          cp .github/scripts/plugin_manifest.py "$RUNNER_TEMP/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A merge can land while this runs; rebuild the commit on the new master and try again.
          for attempt in 1 2 3; do
            git fetch --quiet "$remote" master
            git checkout --quiet -B manifest-update FETCH_HEAD
            python3 "$RUNNER_TEMP/plugin_manifest.py" add manifest.json --version "$PLUGIN_VERSION" \
              --target-abi "$target_abi" --source-url "$PLUGIN_URL" --checksum "$CHECKSUM" \
              --changelog "Image ${TAG} (Jellyfin ${JELLYFIN_VERSION}). Release notes: ${RELEASE_URL}"
            git commit --quiet -m "Add ${TAG} (plugin ${PLUGIN_VERSION}) to the plugin manifest" manifest.json
            if git push --quiet "$remote" HEAD:master; then
              echo "manifest.json on master lists plugin ${PLUGIN_VERSION}"
              exit 0
            fi
            sleep $(( attempt * 5 ))
          done
          echo "::error::Could not push the manifest update to master"
          exit 1
