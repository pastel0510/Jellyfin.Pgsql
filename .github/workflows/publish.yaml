name: 'Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:

jobs:
  call:
    # Deploys to the upstream plugin repository and needs its DEPLOY_* secrets; forks publish the Docker image only.
    if: github.repository == 'JPVenson/Jellyfin.Pgsql'
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/publish.yaml@master
    with:
      version: ${{ github.event.release.tag_name }}
      is-unstable: ${{ github.event.release.prerelease }}
      dotnet-version: "10.0.x"
      dotnet-target: "net10.0"
    secrets:
      deploy-host: ${{ secrets.DEPLOY_HOST }}
      deploy-user: ${{ secrets.DEPLOY_USER }}
      deploy-key: ${{ secrets.DEPLOY_KEY }}
